<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Pixel Quest</title><style>*{box-sizing:border-box}body{margin:0;background:#14213c;color:white;font-family:system-ui;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh;object-fit:contain;background:#80d7ff}#hud{position:absolute;top:10px;left:12px;font-weight:900;text-shadow:1px 2px #345;font-size:20px}#buttons{position:absolute;bottom:18px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.group{display:flex;gap:12px}button{pointer-events:auto;background:#233c79c9;color:white;border:2px solid white;border-radius:14px;padding:12px 20px;font-size:24px;touch-action:none}#screen{position:absolute;inset:0;display:grid;place-items:center;background:#0c1b37bb}#card{background:white;color:#182c4b;border-radius:20px;padding:25px;max-width:370px;text-align:center}#card button{background:#ffbb35;color:#24243c;border:0;font-weight:900}#pause{position:absolute;right:12px;top:10px;font-size:17px}</style><canvas id="c" width="960" height="540"></canvas><div id="hud"></div><button id="pause">Ⅱ</button><div id="buttons"><div class="group"><button data-k="l">◀</button><button data-k="r">▶</button></div><button data-k="j">⬆ JUMP</button></div><div id="screen"><div id="card"><h1 id="title">🌟 Pixel Quest</h1><p id="msg">A horizontal arcade platformer. Run, collect coins, jump over pits, stomp enemies, and reach the flag!<br><br>Keyboard: ← → and Space. Phone: on-screen buttons.</p><button id="start">PLAY</button></div></div><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),hud=document.querySelector('#hud'),screen=document.querySelector('#screen');let mode='menu',keys={l:false,r:false,j:false},p,coins,enemies,cam,score,lives,frame=0,inv=0;const W=6400,G=457,holes=[850,1700,2450,3200,4050,4870,5650],plats=[410,720,1140,1500,1940,2280,2700,3070,3550,3900,4380,4760,5200,5530,6000].map((x,i)=>({x,y:355-(i%3)*27,w:165}));function reset(){p={x:60,y:280,vx:0,vy:0,ground:false};coins=[];for(let x=160;x<W-120;x+=95)coins.push({x,y:350-Math.sin(x/100)*36,got:false});plats.forEach(a=>{coins.push({x:a.x+50,y:a.y-30,got:false},{x:a.x+110,y:a.y-30,got:false})});enemies=[630,1300,2050,2880,3720,4500,5370,5930].map(x=>({x,y:G-30,origin:x,dir:1,dead:false}));cam=0;score=0;lives=3;inv=0}reset();function overlay(t,m,b){document.querySelector('#title').textContent=t;document.querySelector('#msg').innerHTML=m;document.querySelector('#start').textContent=b;screen.style.display='grid'}document.querySelector('#start').onclick=()=>{if(mode!=='paused')reset();mode='play';screen.style.display='none'};document.querySelector('#pause').onclick=()=>{if(mode==='play'){mode='paused';overlay('Paused','Your adventure is waiting.','RESUME')}else if(mode==='paused'){mode='play';screen.style.display='none'}};document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=e=>{keys[k]=false}});let keymap={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',Space:'j',ArrowUp:'j',KeyW:'j'};onkeydown=e=>{if(keymap[e.code]){e.preventDefault();keys[keymap[e.code]]=true}};onkeyup=e=>{if(keymap[e.code])keys[keymap[e.code]]=false};onblur=()=>{keys={l:false,r:false,j:false}};function hurt(){if(inv)return;lives--;if(!lives){mode='over';overlay('Game Over','You collected '+score+' coins. Try again!','RESTART')}else{p.x=Math.max(60,p.x-170);p.y=180;p.vy=0;inv=95}}function update(){if(mode!=='play')return;frame++;if(inv)inv--;p.vx=(keys.r?4.7:0)-(keys.l?4.7:0);if(keys.j&&p.ground){p.vy=-13;p.ground=false}let oldBottom=p.y+42;p.x=Math.max(0,Math.min(W-45,p.x+p.vx));p.vy=Math.min(17,p.vy+.65);p.y+=p.vy;p.ground=false;let gap=holes.some(x=>p.x+30>x&&p.x<x+115);if(!gap&&p.y+42>=G&&oldBottom<=G+18&&p.vy>=0){p.y=G-42;p.vy=0;p.ground=true}plats.forEach(a=>{if(p.x+30>a.x&&p.x<a.x+a.w&&oldBottom<=a.y+9&&p.y+42>=a.y&&p.vy>=0){p.y=a.y-42;p.vy=0;p.ground=true}});if(p.y>560)hurt();coins.forEach(a=>{if(!a.got&&Math.abs(p.x+17-a.x)<27&&Math.abs(p.y+21-a.y)<29){a.got=true;score++}});enemies.forEach(a=>{if(a.dead)return;a.x+=a.dir*.75;if(Math.abs(a.x-a.origin)>55)a.dir*=-1;if(p.x<a.x+32&&p.x+30>a.x&&p.y<a.y+30&&p.y+42>a.y){if(p.vy>0&&oldBottom<=a.y+14){a.dead=true;p.y=a.y-42;p.vy=-9;score+=3}else{lives=0;mode='over';overlay('💥 Game Over','You touched an enemy! You collected '+score+' coins.','RESTART')}}});cam+=(Math.max(0,Math.min(W-960,p.x-280))-cam)*.13;if(p.x>W-130){mode='won';overlay('🏆 You Win!','You collected '+score+' coins and reached the finish!','PLAY AGAIN')}hud.textContent='🪙 '+score+'     ❤️ '+lives+'     🏁 '+Math.min(100,Math.floor(p.x/(W-130)*100))+'%'}function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),w,h)}function draw(){let sky=g.createLinearGradient(0,0,0,540);sky.addColorStop(0,'#73caff');sky.addColorStop(1,'#d1f5ff');g.fillStyle=sky;g.fillRect(0,0,960,540);for(let i=0;i<35;i++){let x=i*250-cam*.23;g.fillStyle='#ffffffa8';g.beginPath();g.ellipse(x,85+i%4*43,55,19,0,0,7);g.fill()}for(let i=0;i<30;i++){let x=i*260-cam*.45;g.fillStyle=i%2?'#8bd3a1':'#a9e6ac';g.beginPath();g.arc(x+80,510,135,Math.PI,0);g.fill()}for(let x=0;x<W;x+=40){if(holes.some(h=>x>=h&&x<h+115))continue;rect(x-cam,G,40,83,'#a96e43');rect(x-cam,G,40,12,'#45bd59');rect(x-cam+10,G+27,9,8,'#d6a36b')}plats.forEach(a=>{rect(a.x-cam,a.y,a.w,21,'#a86c41');rect(a.x-cam,a.y,a.w,8,'#40bc53')});coins.forEach(a=>{if(a.got||a.x<cam-20||a.x>cam+980)return;g.fillStyle='#e8a51e';g.beginPath();g.arc(a.x-cam,a.y,13,0,7);g.fill();g.fillStyle='#ffeb66';g.beginPath();g.arc(a.x-cam-2,a.y-2,9,0,7);g.fill()});enemies.forEach(a=>{if(a.dead)return;rect(a.x-cam,G-30,32,30,'#9a4fbd');rect(a.x-cam+5,G-24,7,8,'white');rect(a.x-cam+21,G-24,7,8,'white');rect(a.x-cam+8,G-21,3,5,'#17234b');rect(a.x-cam+24,G-21,3,5,'#17234b')});rect(W-100-cam,G-240,7,240,'white');rect(W-93-cam,G-240,75,45,'#ff5c57');if(!inv||frame%10<5){let x=p.x-cam,y=p.y;rect(x+5,y+15,23,23,'#3576e2');rect(x+3,y+35,12,8,'#243f8b');rect(x+20,y+35,12,8,'#243f8b');rect(x+2,y+6,30,19,'#ffd4a3');rect(x,y,33,10,'#f34e4e');rect(x+20,y+13,5,5,'#263456')}}let prev=0,acc=0;function loop(t){acc+=Math.min(50,t-prev||16.7);prev=t;while(acc>=16.67){update();acc-=16.67}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
